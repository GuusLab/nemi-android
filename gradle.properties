# Maven coordinates. JitPack overrides group and version on the command line.
group=com.guuslab.nemi
version=0.1.0

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# compileSdk for nemi-android. Override with -Pnemi.compileSdk=34 to build against
# an older installed platform.
nemi.compileSdk=35
